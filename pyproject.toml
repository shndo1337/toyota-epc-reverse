[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "toyota-epc"
version = "1.0.0"
description = "Toyota EPC 2025.01 extracted from the installer ISO and served as a local REST catalog"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pillow>=12,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.15,<1",
    "mypy>=1.15,<3",
]

[project.scripts]
epc-extract = "epc.extract:main"
epc-import = "epc.importer:main"

[tool.setuptools.packages.find]
include = ["epc*"]

[tool.setuptools.package-data]
epc = ["schema.sql", "static/*.html", "static/css/*", "static/fonts/*", "static/js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RET", "PT", "N", "RUF", "PL", "PERF"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"epc/api/routes/*" = ["PLR0917"]
"tests/*" = ["PLR0917"]

[tool.ruff.lint.isort]
known-first-party = ["epc"]

[tool.mypy]
strict = true
files = ["epc", "tests", "scripts"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
